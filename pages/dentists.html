<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="คลินิกทันตกรรม ให้บริการจัดฟัน อุดฟัน ถอนฟัน ฟอกสีฟัน และบริการทันตกรรมอื่นๆ">

    <title>SuperSmile | ทันตแพทย์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div id="header"></div>
    <main>
    <!-- ทันตแทพย์ -->
    <section id="dentistspages" class="dentists-section">

        <div class="section-heading">

            <h2>
            ทันตแพทย์ของเรา
            </h2>

            <p>
            ดูแลทุกขั้นตอนด้วยความใส่ใจ
            เพื่อสุขภาพฟันและรอยยิ้มที่มั่นใจของคุณ
            </p>

        </div>


    <!-- Dentist Cards -->
        <div class="dentists-grid">


        <!-- หมอแทน -->
            <article class="dentist-card">

                <div class="dentist-image">

                    <img
                    src="../images/Vegeta.jpg"
                    alt="หมอแทน SuperSmile Dental Clinic"
                    >

                </div>

                <div class="dentist-info">

                    <span class="dentist-label">
                    DENTIST
                    </span>

                    <h3>
                        หมอแทน
                    </h3>

                    <p class="dentist-position">
                        ทันตแพทย์
                    </p>

                    <div class="dentist-line"></div>

                    <p class="dentist-description">
                        พร้อมดูแลสุขภาพช่องปาก
                        และรอยยิ้มของคนไข้
                        ด้วยความใส่ใจในทุกขั้นตอน
                    </p>

                </div>

            </article>


        <!-- หมออาร์ท -->
            <article class="dentist-card">

                <div class="dentist-image">

                    <img
                        src="../images/Goku.jpeg"
                        alt="หมออาร์ท SuperSmile Dental Clinic"
                    >

                </div>

                <div class="dentist-info">

                    <span class="dentist-label">
                        DENTIST
                    </span>

                    <h3>
                        หมออาร์ท
                    </h3>

                    <p class="dentist-position">
                        ทันตแพทย์
                    </p>

                    <div class="dentist-line"></div>

                    <p class="dentist-description">
                        ดูแลคนไข้ด้วยความใส่ใจ
                        พร้อมให้คำแนะนำการดูแล
                        สุขภาพช่องปากอย่างเหมาะสม
                    </p>

                </div>

            </article>


        </div>

    </section>

    </main>
    <div id="footer"></div>

    <script src="../js/script.js"></script>

</body>
